[project]
name = "turnwise-decision-lab"
version = "0.5.0"
description = "Outcome-scored experiment on per-turn routing: when an agent turn needs a model, a tool, a workflow or nothing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Diogo Santos"}]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]

[project.scripts]
turnwise-lab = "turnwise_lab.__main__:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turnwise_lab*"]

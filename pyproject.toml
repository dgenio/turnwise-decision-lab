[project]
name = "turnwise-decision-lab"
version = "0.5.0"
description = "Outcome-scored experiment on per-turn routing: when an agent turn needs a model, a tool, a workflow or nothing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Diogo Santos"}]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]

[project.scripts]
turnwise-lab = "turnwise_lab.__main__:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turnwise_lab*"]

# CI runs `python -m ruff check .` with the version pinned in .github/workflows/tests.yml.
# Pyflakes-level rules only: undefined names, unused imports and variables, redefinitions.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Frozen v0.5 experiment file: left byte-identical rather than tidied.
"turnwise_lab/arena.py" = ["F401"]

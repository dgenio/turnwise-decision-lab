[project]
name = "turnwise-decision-lab"
version = "0.7.0"
description = "Route the work, not just the model: a small lab that measures who should choose each agent step, and whether checking the exit matters more"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Diogo Santos"}]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]
# Optional real local inference (CPU). Tests and CI never need these.
local = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.24", "onnx>=1.16"]

[project.scripts]
turnwise-lab = "turnwise_lab.__main__:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turnwise_lab*"]

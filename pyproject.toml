[project]
name = "turnwise-decision-lab"
version = "0.6.0"
description = "Decision-driven agent control: a lightweight learned decision model chooses each next operation; compared with a heavy-only LLM agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Diogo Santos"}]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]
# Optional real local inference (CPU). Tests and CI never need these.
local = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.24", "onnx>=1.16"]

[project.scripts]
turnwise-lab = "turnwise_lab.__main__:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turnwise_lab*"]

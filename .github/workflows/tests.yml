name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests (no external inference)
        run: python -m unittest discover -s tests -v
      - name: Regenerate every committed report and page
        run: |
          python -m turnwise_lab.arena
          python -m turnwise_lab.explorer
          python -m turnwise_lab.agent.bench --report
          python -m turnwise_lab.agent.audit
          python -m turnwise_lab.agent.demo
          python -m turnwise_lab.live_demo --output reports/live-local-run.json
          python -m turnwise_lab.benchmark --output /tmp/trained.json --markdown reports/trained-routing-synthetic.md
          python -m turnwise_lab.showcase --json-out demo/showcase.json --html-out demo/planning-contract.html
          python -m scripts.render_local_demo
          python -m turnwise_lab.evaluate --output reports/synthetic-contract-replay.json
      - name: No model weights, caches or secrets are committed
        run: |
          ! git ls-files | grep -E '\.(onnx|onnx_data|safetensors|gguf|bin)$'
      - name: Committed evidence must be byte-identical to a fresh run (v0.4 benchmark JSON excluded; it records wall-clock timings)
        run: git diff --exit-code -- reports demo

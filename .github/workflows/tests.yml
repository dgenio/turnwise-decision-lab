name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests (no external inference)
        run: python -m unittest discover -s tests -v
      - name: Functional local execution receipts
        run: python -m turnwise_lab.live_demo --output /tmp/live-local.json
      - name: Synthetic trained routing benchmark
        run: python -m turnwise_lab.benchmark --output /tmp/trained.json --markdown /tmp/trained.md
      - name: Validate planning-only exhibit and static functional exhibit
        run: |
          python -m turnwise_lab.showcase --json-out /tmp/showcase.json --html-out /tmp/showcase.html
          python -m scripts.render_local_demo
      - name: Original contract smoke replay
        run: python -m turnwise_lab.evaluate --output /tmp/replay.json
